name: Release

# Manually triggered from the Actions tab. Cutting a release is two steps:
#   1. `release-pr`: bump versions and update the changelog in a release PR.
#   2. Merge that PR, then run `release`: publish to crates.io, tag `vX.Y.Z`, and create a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      command:
        description: release-plz command to run
        type: choice
        options:
          - release-pr
          - release
        default: release-pr

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    if: inputs.command == 'release-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    if: inputs.command == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # `release-plz release` looks up the PR that merged the release commit.
      pull-requests: read
      # crates.io trusted publishing, used when the CARGO_REGISTRY_TOKEN secret is unset.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
